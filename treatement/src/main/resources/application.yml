# =============================================================
# PharmaApp — treatment-service
# application.yml
# =============================================================
server:
  port: 8084

spring:
  application:
    name: treatment-service

  datasource:
    url: jdbc:mysql://localhost:3306/treatment_test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:pharmacare}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ← AJOUT : Kafka producer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

pharmaApp:
  services:
    medication-service:   ${MEDICATION_SERVICE_URL:http://localhost:8083}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    adherence-service:    ${ADHERENCE_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# =============================================================
# Profil "dev"
# =============================================================
---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.pharmaApp.treatement: DEBUG
    org.springframework.web: DEBUG
    org.springframework.kafka: INFO
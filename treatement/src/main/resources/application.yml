# =============================================================
# PharmaApp — treatment-service
# application.yml
# =============================================================
server:
  port: 8084

spring:
  application:
    name: treatment-service

  # Configuration par défaut (sans profil)
  datasource:
    url: jdbc:mysql://localhost:3306/treatment_test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:pharmacare}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Configuration spécifique au profil "dev"
---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true  # Plus de logs SQL en dev

logging:
  level:
    com.pharmaApp.treatement.infrastructure.adapter.out.client: DEBUG
    org.springframework.web: DEBUG

# Le reste de votre configuration...
pharmaApp:
  services:
    medication-service: ${MEDICATION_SERVICE_URL:http://localhost:8083}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    adherence-service: ${ADHERENCE_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
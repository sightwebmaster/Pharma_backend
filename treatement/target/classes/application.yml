# =============================================================
# PharmaApp — treatment-service
# application.yml
# =============================================================

server:
  port: 8084

spring:
  application:
    name: treatment-service

  datasource:
    url: jdbc:mysql://localhost:3308/treatment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:pharmacare}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: treatment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pharmaApp.*"

# ── Eureka ──────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# ── URLs des autres services (Feign fallback) ────────────────
pharmaApp:
  services:
    user-service: ${USER_SERVICE_URL:http://localhost:8083}
    adherence-service: ${ADHERENCE_SERVICE_URL:http://localhost:8086}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    com.pharmaApp.tratement: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
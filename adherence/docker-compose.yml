version: '3.8'

# ──────────────────────────────────────────────────────────────
# docker-compose.yml — adherence-service
# Lance : MySQL + Kafka + Zookeeper + adherence-service
# Usage : docker-compose up -d
# ──────────────────────────────────────────────────────────────

services:

  # ── MySQL ────────────────────────────────────────────────────
  adherence-mysql:
    image: mysql:8.0
    container_name: adherence-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: adherence_db
      MYSQL_USER: adherence
      MYSQL_PASSWORD: adherencepassword
    ports:
      - "3309:3306"
    volumes:
      - adherence_mysql_data:/var/lib/mysql
    networks:
      - pharma-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── Zookeeper (requis par Kafka) ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: adherence-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pharma-net

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: adherence-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pharma-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── adherence-service ────────────────────────────────────────
  adherence-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adherence-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://adherence-mysql:3306/adherence_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: adherence
      SPRING_DATASOURCE_PASSWORD: adherencepassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/pharma-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/pharma-realm/protocol/openid-connect/certs
    depends_on:
      adherence-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pharma-net
    restart: on-failure

networks:
  pharma-net:
    external: true   # réseau partagé avec les autres services PharmaCare

volumes:
  adherence_mysql_data:
